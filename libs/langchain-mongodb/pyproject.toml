
[build-system]
requires = ["hatchling>1.24"]
build-backend = "hatchling.build"

[project]
name = "langchain-mongodb"
version = "0.12.0"
description = "An integration package connecting MongoDB and LangChain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 1.4.2 is the lowest version anything is ever tested against: langchain-tests
    # is pinned in the dev group and requires >=1.4.0, so no dev or CI environment
    # can resolve lower. Declaring a floor below that would ship users a version
    # range we never exercise.
    "langchain-core>=1.4.2",
    "langchain>=1.0",
    "langchain-classic>=1.0",
    "pydantic>=2.13.0",
    "pymongo>=4.6.1",
    "langchain-text-splitters>=1.0",
    # 2.3.2 is the first numpy with cp314 wheels; earlier ones fall back to a
    # source build that fails to compile. Split so 3.11-3.13 users keep the
    # lower floor rather than being forced onto numpy 2.3+.
    "numpy>=1.26; python_version < '3.14'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "lark<2.0.0,>=1.1.9",
    "pymongo-search-utils>=0.3.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.2.2",
    "langchain>=1.0",
    # kept in sync with the runtime floor; tests/unit_tests/test_cache.py calls
    # llm.asdict(), which landed in 1.4.2
    "langchain-core>=1.4.2",
    "langchain-text-splitters>=1.0",
    "pytest-mock>=3.10.0",
    "pytest>=7.3.0",
    "syrupy>=4.0.2",
    "pytest-watcher>=0.3.4",
    "pytest-asyncio>=0.21.1",
    "pre-commit>=4.0",
    "mypy>=1.10",
    "simsimd>=6.5.0",
    "langchain-ollama>=1.0",
    "langchain-openai>=1.0",
    "langchain-community>=0.3.27",
    "pypdf>=5.0.1",
    "langgraph>=1.0.0",
    "flaky>=3.8.1",
    "langchain-tests==1.1.9",
    "pip>=25.0.1",
    # langchain-protocol (via langchain-core) uses PEP 728 TypedDict extra_items,
    # added in 4.13.0, but declares only >=4.7.0 — so our floor has to carry it.
    "typing-extensions>=4.13.0",
]

[project.optional-dependencies]
viz = [
    "networkx>=3.0",
    "holoviews>=1.19",
]

[tool.pytest.ini_options]
minversion = "7"
addopts = "--snapshot-warn-unused --strict-markers --strict-config --durations=5"
log_cli_level = "INFO"
faulthandler_timeout = 1500
xfail_strict = true
markers = [
    "requires: mark tests as requiring a specific library",
    "compile: mark placeholder test used to compile integration tests without running them",
    "viz: marks tests as requiring optional-dependency group `viz`",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Ignore ResourceWarning raised by langchain standardized base classes.
    "ignore:unclosed <socket.socket:ResourceWarning",
    # Suppress pending deprecation from langchain-core loads() raised by upstream packages.
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.mypy]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["no-untyped-def", "no-untyped-call", "var-annotated"]

[tool.ruff]
lint.select = [
  "E",  # pycodestyle
  "F",  # Pyflakes
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "I",  # isort
]
lint.ignore = ["E501", "B008", "UP007", "UP006", "UP035", "UP045"]

[tool.coverage.run]
omit = ["tests/*"]
